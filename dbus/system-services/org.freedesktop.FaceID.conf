<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Allow root to own the service -->
  <policy user="root">
    <allow own="org.freedesktop.FaceID"/>
    <allow own_prefix="org.freedesktop.FaceID"/>
    <allow send_destination="org.freedesktop.FaceID"/>
    <allow send_interface="org.freedesktop.FaceID.Device"/>
    <allow send_interface="org.freedesktop.FaceID.Manager"/>
  </policy>

  <!-- Allow any user to call methods -->
  <policy context="default">
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="VerifyStart"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="VerifyStop"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="EnrollStart"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="EnrollStop"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="DetectFace"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="GenerateEmbedding"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="VerifyFace"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="SaveEmbedding"/>
    <allow send_destination="org.freedesktop.FaceID"
           send_interface="org.freedesktop.FaceID.Device"
           send_member="GetStatus"/>
  </policy>

  <!-- Allow FaceID to emit signals -->
  <policy user="root">
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
