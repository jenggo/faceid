# FaceID Configuration

[camera]
device = /dev/video2
width = 640
height = 360

[recognition]
# Threshold for face matching (lower = more strict, higher = more lenient)
# SFace recommended: 0.3-0.5
# Glint recommended: 0.01-0.1
threshold = 0.4
# Timeout in seconds for authentication attempt
timeout = 5

# Number of CPU threads for NCNN inference (detection + recognition)
# Recommended: match your CPU core count (use 'nproc' to check)
# Default: 4 (safe for most systems)
# More threads = faster inference (within core count)
# Diminishing returns beyond physical core count
num_threads = 8

[face_detection]
# Face detection confidence threshold (0.0-1.0, higher = stricter)
# Filters out low-confidence detections to reduce false positives
# Default: 0.31 (works well for most cases)
# For IR cameras or low-light: lower values (0.1-0.2) may work better
# For bright conditions: higher values (0.5-0.7) reduce false positives
#
# AUTOMATIC ADAPTATION: Uses 3-stage cascading detection
#   Stage 1: Standard CLAHE preprocessing + primary detector
#   Stage 2: Aggressive CLAHE (low-light/IR) + primary detector
#   Stage 3: Aggressive CLAHE + secondary fallback detector
# This automatically adapts to lighting conditions without manual tuning
confidence = 0.31
# Face tracking optimization: only run full detection every N frames
# Uses optical flow tracking for intermediate frames (much faster)
# Values: 0 = always detect (no tracking), 5-10 = recommended, 15+ = aggressive
# Recommended: 10 (gives ~84% speed improvement)
tracking_interval = 10

[logging]
# Log file location
log_file = /var/log/faceid.log
# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO

[authentication]
# Enable parallel face + fingerprint authentication
# First method to succeed will authenticate the user
enable_fingerprint = true
# Check lid state before attempting biometric authentication
# Biometrics will be skipped if lid is closed (falls through to password)
check_lid_state = true
# Check display state before attempting biometric authentication
# Biometrics will be skipped if display is off/blanked (falls through to password)
# This prevents camera/fingerprint from waking the device when screen is off
check_display_state = true
# Skip biometric authentication when using external monitor only (laptop screen off)
# This is useful when laptop is docked - camera can't see your face properly
# When enabled, biometrics will only work when laptop's built-in display is on
skip_external_monitor_only = true

# Delay (in milliseconds) before starting biometric auth on lock screen
# This gives the screen time to turn off after pressing lock button (Meta+L)
# Recommended: 500-1500ms (1500ms = 1.5 seconds)
# Set to 0 to disable delay
lock_screen_delay_ms = 1000

# Delay (in milliseconds) before initializing fingerprint reader
# Since face detection is very fast (~27ms), delaying fingerprint saves battery
# Face auth gets a head start, fingerprint only activates if face fails quickly
# Recommended: 300-1000ms (gives face auth time to succeed first)
# Set to 0 to start both methods simultaneously (legacy behavior)
fingerprint_delay_ms = 500

[presence_detection]
# Enable/disable presence detection service
enabled = true

# Time (in seconds) of inactivity before starting face scanning
# During active use (typing/mouse), NO scanning occurs (saves battery)
inactive_threshold_seconds = 15

# Interval (in seconds) between face scans when idle
scan_interval_seconds = 5

# Number of consecutive scan failures before confirming user is away
max_scan_failures = 2

# Maximum idle time (in minutes) before confirming user is away
# After this time, screen locks even if scans are inconclusive
max_idle_time_minutes = 15

# Mouse jitter filter threshold (in milliseconds)
# Input events faster than this are considered noise (desk bumps, etc.)
# Only movements separated by more than this threshold reset the idle timer
mouse_jitter_threshold_ms = 300

# Camera shutter detection thresholds
# Mean brightness below this value indicates closed shutter
shutter_brightness_threshold = 10.0

# Brightness standard deviation below this indicates uniform (closed) shutter
shutter_variance_threshold = 2.0

# Time (in minutes) to wait before locking if shutter is closed
# User may close shutter for privacy - don't immediately lock
# After this timeout, lock screen anyway for security
shutter_timeout_minutes = 5

# Camera resolution for presence detection (optional)
# If not specified or set to -1, uses camera's native resolution
# For standard USB cameras: 640x480
# For IR cameras: may be 640x360 or other
# For high-res cameras: 1280x720 or higher
# Note: If camera doesn't support specified resolution, presence detection will be disabled
presence_camera_width = 640
presence_camera_height = 360

[no_peek]
# Enable/disable "no peek" detection
# Detects additional faces (shoulder surfing) behind the user
# When enabled, screen will BLANK (but not lock) if extra face detected
enabled = true

# Minimum distance (in pixels) between detected faces to count as separate person
# This prevents false positives from same person's reflection or shifted position
# Typical face width is 100-150 pixels at arm's length
min_face_distance_pixels = 80

# Minimum face size (as percentage of screen width) to count as "peek threat"
# Faces smaller than this are too far away to read the screen clearly
# Recommended: 0.08 (8% of screen width) = ~2 meters distance
min_face_size_percent = 0.08

# Delay (in seconds) before blanking screen after detecting extra face
# This prevents accidental blanking when someone walks by
# Only if face stays for this duration will screen blank
peek_detection_delay_seconds = 2

# Grace period (in seconds) after extra face disappears before re-enabling screen
# This prevents screen flickering if person moves in/out of frame
unblank_delay_seconds = 3

[schedule]
# Enable/disable schedule-based presence detection
# When enabled, presence detection only runs during configured days/times
enabled = false

# Active days (comma-separated, 1=Monday, 7=Sunday)
# Examples:
#   1,2,3,4,5      = Monday through Friday (weekdays)
#   4              = Thursday only
#   1,3,5          = Monday, Wednesday, Friday
#   6,7            = Saturday, Sunday (weekends)
active_days = 1,2,3,4,5

# Active time range (24-hour format: HHMM)
# Examples:
#   0900-1700      = 9 AM to 5 PM
#   0800-1200      = 8 AM to 12 PM (noon)
#   1400-2200      = 2 PM to 10 PM
#   0000-2359      = All day
time_start = 0900
time_end = 1700

# ============================================================================
# QUICK WINS ACCURACY OPTIMIZATION
# ============================================================================
# These features are read from [recognition] section by the face detector
# They improve recognition accuracy in challenging conditions

# PHASE 2: Adaptive Preprocessing for Variable Lighting
# Automatically adjusts image preprocessing based on detected lighting conditions
# Significantly improves recognition accuracy in dark/bright/variable lighting

# Enable adaptive gamma correction (brightens dark images, darkens bright images)
# Automatically detects brightness level and applies appropriate gamma adjustment
# Impact: Significant improvement in extreme lighting conditions
# Recommended: true (enabled by default)
enable_gamma_correction = true

# Enable brightness normalization (linear scaling toward target level)
# Normalizes brightness to consistent level before encoding
# Impact: Improves consistency across different lighting conditions
# Recommended: true (enabled by default)
enable_brightness_normalization = true

# Enable adaptive CLAHE (contrast-limited adaptive histogram equalization)
# Automatically adjusts enhancement strength based on image contrast
# Low contrast images get stronger enhancement, high contrast get gentler processing
# Impact: Major improvement in low-light and backlit conditions
# Recommended: true (enabled by default, replaces basic histogram_eq)
enable_adaptive_clahe = true

# LEGACY: Basic histogram equalization (now redundant with adaptive CLAHE)
# This was the original quick win #1, now superseded by adaptive_clahe
# Normalizes lighting variations on aligned face crops before encoding
# Impact: ~1-2% accuracy improvement, ~1ms overhead per face
# Recommended: false (adaptive_clahe is better)
enable_histogram_eq = false

# PHASE 3: Quality-Weighted Matching
# Uses quality scores (stored during enrollment) to weight matching accuracy
# High-quality encodings are trusted more, low-quality encodings trusted less
# This improves authentication accuracy by focusing on best reference samples

# Minimum quality threshold for using stored encodings during authentication
# Encodings below this quality are skipped to avoid unreliable comparisons
# Quality range: 0.0 (poor) to 1.0 (perfect)
# Recommended: 0.5 (skip bottom 50% quality encodings)
# Impact: Reduces false positives by ignoring low-quality reference samples
min_encoding_quality = 0.5

# Minimum quality score (0.0-1.0) required for a face to be encoded during enrollment
# Quality checks: blur detection (Laplacian), face size, brightness uniformity, detector confidence
# Faces below this threshold are skipped to avoid encoding low-quality samples
# Set to 0.0 to disable quality filtering
# Recommended: 0.70 (70% quality threshold)
# Impact: ~2-3% false positive reduction during enrollment
min_face_quality = 0.70

# DEBUG: Log quality scores for each detected face (verbose)
# Helps troubleshoot why faces are being rejected
# Disable in production (lots of logging)
debug_face_quality = false

# Head pose estimation and correction
# Applies geometric transformation to normalize head orientation before recognition
# Compensates for yaw/pitch/roll variations to improve recognition at different angles
# Recommended: true for better accuracy with head movements
enable_head_pose_correction = true

# PHASE 4: Temporal Smoothing
# Requires multiple consecutive frames to match during authentication
# Reduces false positives from glare, motion blur, or lucky random matches
# Adds ~50-150ms latency (3 frames @ 30fps = 100ms + processing)

# Enable temporal smoothing (require consistency across multiple frames)
# When enabled, authentication requires 2 out of 3 consecutive frames to match
# When disabled, single frame match is sufficient (legacy behavior)
# Recommended: true (significantly improves security and reduces false positives)
enable_temporal_smoothing = true

# Number of consecutive frames to capture and analyze
# More frames = more robust but slower authentication
# Recommended: 3 (good balance between speed and accuracy)
temporal_frames = 3

# Minimum number of matching frames required (majority vote)
# Should be more than half of temporal_frames for reliability
# Example: 3 frames requires 2 matches, 5 frames requires 3 matches
# Recommended: 2 (for temporal_frames=3)
required_consecutive_matches = 2
